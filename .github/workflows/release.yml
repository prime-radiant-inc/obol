name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release
  id-token: write # OIDC for npm provenance / trusted publishing

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never cancel a half-done publish

jobs:
  dylibs:
    name: dylib (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, name: darwin-arm64, ext: dylib }
          - { os: macos-15-intel, name: darwin-x64, ext: dylib }
          - { os: ubuntu-24.04, name: linux-x64, ext: so }
          - { os: ubuntu-24.04-arm, name: linux-arm64, ext: so }
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - name: Build release cdylib
        run: mise exec rust@1.96.0 -- cargo build --release -p obol-ffi
      - name: Strip (per-OS)
        run: |
          LIB="target/release/libobol_ffi.${{ matrix.ext }}"
          if [ "$RUNNER_OS" = "macOS" ]; then strip -x "$LIB"; else strip "$LIB"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: dylib-${{ matrix.name }}
          path: target/release/libobol_ffi.${{ matrix.ext }}
          if-no-files-found: error

  publish:
    needs: dylibs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Pin npm (trusted publishing + provenance need >= 11.5.1)
        run: npm install -g npm@^11.5.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/dylibs
      - name: Assemble native/
        working-directory: bindings/typescript
        run: |
          mkdir -p native/darwin-arm64 native/darwin-x64 native/linux-x64 native/linux-arm64
          cp /tmp/dylibs/dylib-darwin-arm64/libobol_ffi.dylib native/darwin-arm64/
          cp /tmp/dylibs/dylib-darwin-x64/libobol_ffi.dylib   native/darwin-x64/
          cp /tmp/dylibs/dylib-linux-x64/libobol_ffi.so       native/linux-x64/
          cp /tmp/dylibs/dylib-linux-arm64/libobol_ffi.so     native/linux-arm64/
      - name: Build dist + stamp version
        working-directory: bindings/typescript
        run: |
          bun install
          bun x tsup
          npm pkg set version="${GITHUB_REF_NAME#v}"
      - name: Publish to npm (OIDC trusted publishing)
        working-directory: bindings/typescript
        # Tokenless: npm classic tokens are deprecated, so the bootstrap (package creation) is a
        # one-time MANUAL publish from a maintainer's machine; every CI release after authenticates
        # via the configured Trusted Publisher (OIDC). No `.npmrc` token line — an empty
        # `_authToken=` would block OIDC activation. provenance:true (in package.json) works because
        # the repo is public and the job has `id-token: write`. Prerelease tags → `next` dist-tag.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIST_TAG="latest"; case "$VERSION" in *-*) DIST_TAG="next";; esac
          rm -f "$HOME/.npmrc"
          npm publish --tag "$DIST_TAG"
      - name: Stage release assets (arch-qualified names — basenames collide otherwise)
        run: |
          mkdir -p /tmp/assets
          cp /tmp/dylibs/dylib-darwin-arm64/libobol_ffi.dylib /tmp/assets/libobol_ffi-darwin-arm64.dylib
          cp /tmp/dylibs/dylib-darwin-x64/libobol_ffi.dylib   /tmp/assets/libobol_ffi-darwin-x64.dylib
          cp /tmp/dylibs/dylib-linux-x64/libobol_ffi.so       /tmp/assets/libobol_ffi-linux-x64.so
          cp /tmp/dylibs/dylib-linux-arm64/libobol_ffi.so     /tmp/assets/libobol_ffi-linux-arm64.so
      - name: GitHub Release with dylibs
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/assets/libobol_ffi-*
          fail_on_unmatched_files: true

  publish-go:
    needs: dylibs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4 # monorepo: source + assemble script
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/dylibs # → /tmp/dylibs/dylib-<plat>-<arch>/libobol_ffi.*
      - name: Check out obol-go
        uses: actions/checkout@v4
        with:
          repository: prime-radiant-inc/obol-go
          token: ${{ secrets.OBOL_GO_TOKEN }} # fine-grained PAT, Contents:write on obol-go
          path: obol-go
      - name: Refuse if tag already published (proxy.golang.org is immutable)
        working-directory: obol-go
        run: |
          if git ls-remote --exit-code --tags origin "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "::error::${GITHUB_REF_NAME} already tagged on obol-go — bump the version."; exit 1
          fi
      - name: Assemble module
        run: scripts/assemble-obol-go.sh "$GITHUB_WORKSPACE/obol-go" /tmp/dylibs "${GITHUB_REF_NAME#v}"
      - name: Smoke test (embed→extract→Dlopen, no OBOL_LIB)
        working-directory: obol-go
        run: CGO_ENABLED=0 go test ./...
      - name: Commit, tag, push
        working-directory: obol-go
        run: |
          git config user.name  "obol-release"
          git config user.email "obol-release@users.noreply.github.com"
          git add -A
          # --allow-empty: the module content is version-independent (the version lives in the tag,
          # not the files), so an unchanged release has no diff — without this, git commit fails.
          git commit --allow-empty -m "Release ${GITHUB_REF_NAME} (generated from prime-radiant-inc/obol@${GITHUB_SHA})"
          git push origin HEAD:main
          # Push the tag EXPLICITLY: `git tag` is lightweight and `--follow-tags` skips those,
          # so the tag would silently never reach obol-go (→ go get can't resolve the version).
          git tag "${GITHUB_REF_NAME}"
          git push origin "refs/tags/${GITHUB_REF_NAME}"
