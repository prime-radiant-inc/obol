name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # Use rust-toolchain (not mise) here: a fresh mise rust install is minimal and lacks the
      # rustfmt/clippy components. The test job keeps mise because the repo scripts call `mise exec`.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets --workspace -- -D warnings

  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, name: macos-arm64 }
          - { os: macos-15-intel, name: macos-x64 }
          - { os: ubuntu-24.04, name: linux-x64 }
          - { os: ubuntu-24.04-arm, name: linux-arm64 }
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --quiet pytest

      - name: Build cdylib
        run: mise exec rust@1.96.0 -- cargo build -p obol-ffi

      - name: Rust tests
        run: mise exec rust@1.96.0 -- cargo test --workspace -- --test-threads=1

      - name: Python binding tests
        working-directory: bindings/python
        run: PYTHONPATH=. python -m pytest tests -q

      - name: Go binding tests
        working-directory: bindings/go
        env:
          CGO_ENABLED: "0"
        run: |
          ext=so; [ "$RUNNER_OS" = "macOS" ] && ext=dylib
          export OBOL_LIB="$GITHUB_WORKSPACE/target/debug/libobol_ffi.$ext"
          go test ./...

      - name: TypeScript binding tests (Bun + Node)
        working-directory: bindings/typescript
        run: |
          bun install
          bun test
          node --test test/obol.test.ts

      - name: Five-language equivalence gate
        run: ./scripts/validate_bindings.sh
