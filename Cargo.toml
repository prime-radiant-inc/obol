[workspace]
resolver = "2"
members = ["crates/obol-core", "crates/obol-cli", "crates/obol-ffi"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
ureq = { version = "2", features = ["json"] }
clap = { version = "4", features = ["derive"] }
